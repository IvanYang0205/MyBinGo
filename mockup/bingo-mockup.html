<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>婚禮數位賓果</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf6f1; --surface:#ffffff; --surface-2:#f4ece4; --ink:#3b2f2b; --muted:#8c7c73; --line:#e8ddd3;
  --accent:#b4536a; --accent-ink:#ffffff; --accent-soft:#f6e3e7;
  --gold:#b98b3e; --gold-soft:#f5ead6;
  --warn:#c77a2a; --warn-soft:#fbead6;
  --info:#4a78a8; --info-soft:#e3ecf6;
  --shadow:0 1px 2px rgba(60,40,30,.06),0 6px 20px rgba(60,40,30,.06);
  --radius:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191413; --surface:#241d1b; --surface-2:#2e2522; --ink:#f2e9e2; --muted:#a8978d; --line:#3a2f2b;
    --accent:#e0869a; --accent-ink:#2a1016; --accent-soft:#44252c;
    --gold:#dcb66f; --gold-soft:#3b3020;
    --warn:#e6a35e; --warn-soft:#3d2c1a;
    --info:#86aee0; --info-soft:#1e2a38;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191413; --surface:#241d1b; --surface-2:#2e2522; --ink:#f2e9e2; --muted:#a8978d; --line:#3a2f2b;
  --accent:#e0869a; --accent-ink:#2a1016; --accent-soft:#44252c;
  --gold:#dcb66f; --gold-soft:#3b3020;
  --warn:#e6a35e; --warn-soft:#3d2c1a;
  --info:#86aee0; --info-soft:#1e2a38;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);min-height:100vh;
  font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.serif{font-family:"Noto Serif TC",serif}
.muted{color:var(--muted)}

/* Mockup 切換列 */
.demo-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);font-size:13px}
.demo-bar .tag{font-weight:700;color:var(--gold);margin-right:6px;letter-spacing:.05em}
.demo-bar a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--muted)}
.demo-bar a.active{background:var(--accent);color:var(--accent-ink)}
.demo-bar .note{margin-left:auto;color:var(--muted)}
@media (max-width:720px){.demo-bar .note{display:none}}

/* 共用元件 */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.ball{width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;
  font:700 28px/1 "Noto Serif TC",serif;color:#fff;
  background:radial-gradient(circle at 30% 28%,#ee9fb0 0%,#c65a73 40%,#8e3a4e 100%);
  box-shadow:inset 0 -4px 8px rgba(0,0,0,.18),0 4px 12px rgba(180,83,106,.3)}
.ball.empty{background:var(--surface-2);color:var(--muted);box-shadow:none}
.pop{animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.3) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;
  opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 賓客頁 */
.guest{max-width:460px;margin:0 auto;padding:20px 16px 48px}
.g-head{text-align:center;margin-bottom:16px}
.eyebrow{font-family:"Noto Serif TC",serif;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);font-size:12px;margin:0 0 6px}
.g-head h1{font:700 24px "Noto Serif TC",serif;margin:0}
.g-head p{margin:6px 0 0}
.qr-sim{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin-bottom:16px;
  border:1px dashed var(--gold);border-radius:12px;background:var(--gold-soft);font-size:13px;color:var(--gold)}
.qr-sim select{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.table-name{text-align:center;font:700 20px "Noto Serif TC",serif;margin:6px 0 12px}
.seats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.seat{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.seat b{font:700 26px "Noto Serif TC",serif}
.seat small{font-size:11px;color:var(--muted)}
.seat:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.hint{font-size:13px;color:var(--muted);text-align:center;line-height:1.6;margin:14px 0 0}
.latest{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow)}
.latest .t{font-size:13px;color:var(--muted)}
.latest .v{font-weight:700;margin-top:2px}
.progress{margin-left:auto;text-align:right}
.dots{display:flex;gap:5px;justify-content:flex-end;margin-top:4px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.dots i.on{background:var(--gold);border-color:var(--gold)}
.card{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px;padding:10px;
  background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow)}
.card .hd{text-align:center;font:700 18px "Noto Serif TC",serif;color:var(--accent);padding:2px 0 4px}
.cell{aspect-ratio:1;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;
  font-size:22px;font-weight:700;display:grid;place-items:center;transition:transform .1s;padding:0}
.cell:active{transform:scale(.93)}
.cell.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cell.in-line{box-shadow:inset 0 0 0 3px var(--gold)}
.cell.free{background:var(--gold-soft);color:var(--gold);font-size:24px;cursor:default}
.cell.nudge{border-color:var(--gold);animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{background:var(--gold-soft);box-shadow:0 0 0 3px var(--gold)}}
.cell.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.bingo{width:100%;margin-top:16px;padding:16px;border:0;border-radius:999px;
  font:700 26px "Noto Serif TC",serif;letter-spacing:.12em;color:#fff;
  background:linear-gradient(135deg,#b4536a,#d18a5c);box-shadow:0 8px 24px rgba(180,83,106,.35)}
.bingo:disabled{background:var(--surface-2);color:var(--muted);box-shadow:none;cursor:not-allowed}
.won{margin-top:16px;padding:16px;border-radius:var(--radius);text-align:center;background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold)}
.won b{display:block;font:700 22px "Noto Serif TC",serif;margin-bottom:4px}
.history{margin-top:16px;font-size:14px}
.history summary{cursor:pointer;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{min-width:34px;text-align:center;padding:4px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.chips span:first-child{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.linkbtn{display:block;margin:20px auto 0;background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline}

/* 後台 */
.admin{max-width:1180px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.admin-head{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.admin-head h1{font:700 24px "Noto Serif TC",serif;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.panel h2{font-size:15px;margin:0 0 12px;color:var(--muted);font-weight:500}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s7{grid-column:span 7}.s8{grid-column:span 8}
@media (max-width:900px){.admin>.panel{grid-column:1/-1}}
.draw-top{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.draw-top .ball{width:108px;height:108px;font-size:52px}
.draw-top .big{font:700 20px "Noto Serif TC",serif}
.draw-actions{display:grid;gap:8px}
.draw-actions .primary{padding:14px;font-size:18px}
.manual{display:flex;gap:8px}
.manual input{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{border-radius:12px;padding:12px;background:var(--surface-2)}
.tile span{display:block;font-size:12px;color:var(--muted)}
.tile b{font:700 30px "Noto Serif TC",serif}
.tile small{color:var(--muted);margin-left:4px}
.tile.warn{background:var(--warn-soft)}.tile.warn b{color:var(--warn)}
.tile.accent{background:var(--accent-soft)}.tile.accent b{color:var(--accent)}
.tile.gold{background:var(--gold-soft)}.tile.gold b{color:var(--gold)}
.namelist{margin-top:12px;font-size:13px;line-height:1.7}
.namelist dt{color:var(--muted);margin-top:6px}
.namelist dd{margin:0}
.winners{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:340px;overflow:auto}
.winners li{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;background:var(--surface-2)}
.winners li.empty{color:var(--muted);justify-content:center}
.winners .rank{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#fff;font-weight:700;font-size:14px}
.winners .names{font-size:14px;margin-top:2px}
.winners small{color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.board div{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;
  background:var(--surface-2);color:var(--muted)}
.board .on{background:var(--gold-soft);color:var(--gold)}
.board .last{background:var(--accent);color:var(--accent-ink)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.seatmap{display:grid;gap:4px;max-height:420px;overflow:auto}
.trow{display:grid;grid-template-columns:40px repeat(10,minmax(0,1fr));gap:4px;align-items:center}
.trow>span{font-size:12px;color:var(--muted);text-align:right;padding-right:4px}
.sq{height:24px;border-radius:6px;font-size:11px;padding:0;border:1px solid var(--line);background:var(--surface-2);color:var(--muted)}
.sq.joined{background:var(--info-soft);color:var(--info);border-color:var(--info-soft)}
.sq.reach{background:var(--warn-soft);color:var(--warn);border-color:var(--warn);font-weight:700}
.sq.unclaimed{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.sq.won{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:700}
.sq.unbound{border-style:dashed;border-color:var(--muted)}
.tools{display:grid;gap:10px}
.tools .manual input{max-width:90px;flex:none}
.tools hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* 大螢幕 */
body[data-view="screen"]{background:#130e0f}
.screen{min-height:calc(100dvh - 46px);color:#f5ebe2;padding:3vh max(16px,3vw);
  background:radial-gradient(1200px 600px at 15% 0%,#3d1b25 0%,transparent 60%),radial-gradient(900px 500px at 100% 100%,#2e2413 0%,transparent 60%),#130e0f;
  display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);grid-template-rows:auto 1fr auto;gap:3vh 3vw}
.sc-title{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.sc-title h1{margin:0;font:700 clamp(22px,3vw,52px) "Noto Serif TC",serif;color:#e8c987;letter-spacing:.2em}
.sc-title span{font-size:clamp(14px,1.6vw,28px);color:rgba(245,235,226,.7)}
.sc-left{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh}
.sc-label{font-size:clamp(14px,1.6vw,28px);letter-spacing:.3em;color:rgba(245,235,226,.7)}
.sc-ball{width:min(30vw,48vh);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  font:700 min(14vw,23vh)/1 "Noto Serif TC",serif;color:#fff;
  background:radial-gradient(circle at 32% 28%,#f0a7b6 0%,#c65a73 38%,#7e2c40 100%);
  box-shadow:0 0 0 min(1vw,1.5vh) rgba(232,201,135,.35),0 20px 60px rgba(0,0,0,.5)}
.sc-ball.empty{background:#2a2022;color:rgba(245,235,226,.3)}
.sc-count{font:600 clamp(16px,2vw,34px) "Noto Serif TC",serif;color:#e8c987}
.sc-recent{display:flex;gap:1vw}
.sc-recent span{width:clamp(34px,3.6vw,64px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  font:600 clamp(14px,1.5vw,28px) "Noto Serif TC",serif;border:1px solid rgba(232,201,135,.5);color:#e8c987}
.sc-board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:min(.9vw,1.4vh);align-content:center}
.sc-board div{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  font:600 clamp(12px,1.9vw,38px) "Noto Serif TC",serif;color:rgba(245,235,226,.28);border:1px solid rgba(245,235,226,.12)}
.sc-board .on{background:#e8c987;color:#2a1c10;border-color:transparent}
.sc-board .last{background:#d9667f;color:#fff;border-color:transparent;box-shadow:0 0 0 4px rgba(217,102,127,.35)}
.sc-foot{grid-column:1/-1;display:flex;gap:3vw;align-items:center;border-top:1px solid rgba(232,201,135,.25);padding-top:2vh;min-width:0}
.sc-stats{display:flex;gap:2.5vw;flex:none}
.sc-stats small{display:block;font-size:clamp(12px,1.2vw,22px);color:rgba(245,235,226,.6)}
.sc-stats b{font:700 clamp(22px,3vw,54px) "Noto Serif TC",serif;color:#e8c987}
.sc-winners{display:flex;flex-wrap:wrap;gap:.8vw;min-width:0}
.sc-chip{padding:.5vh 1.2vw;border-radius:999px;background:rgba(232,201,135,.15);border:1px solid rgba(232,201,135,.5);
  font-size:clamp(13px,1.5vw,28px);color:#f5ebe2}
.sc-dim{color:rgba(245,235,226,.45);font-size:clamp(13px,1.5vw,28px)}
@media (max-width:760px){.screen{grid-template-columns:1fr}.sc-foot{flex-direction:column;align-items:flex-start}}
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(10,6,7,.8);
  opacity:0;pointer-events:none;transition:opacity .3s;padding:16px}
.overlay.show{opacity:1;pointer-events:auto}
.overlay .box{text-align:center;color:#fff}
.overlay h2{margin:0;font:700 clamp(56px,11vw,180px)/1.1 "Noto Serif TC",serif;color:#e8c987;letter-spacing:.08em}
.overlay.show h2{animation:pop .8s cubic-bezier(.2,1.4,.4,1)}
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(20,12,12,.55)}
.modal[hidden]{display:none}
.dlg{width:100%;max-width:360px;background:var(--surface);color:var(--ink);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.dlg p{margin:0 0 16px;line-height:1.6;white-space:pre-line}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end}
.btn:focus-visible,.cell:focus-visible,.seat:focus-visible,.sq:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.overlay p{font-size:clamp(20px,3.5vw,60px);margin:2vh 0 0}
</style>
</head>
<body>
<nav class="demo-bar">
  <span class="tag">MOCKUP</span>
  <a href="#guest">賓客手機</a><a href="#admin">後台</a><a href="#screen">大螢幕</a>
  <span class="note">建議用三個分頁分別開啟，同一瀏覽器內會即時同步；多開賓客分頁可模擬多支手機</span>
</nav>
<main id="app"></main>
<div class="overlay" id="overlay"><div class="box"><h2>BINGO!</h2><p></p></div></div>
<div class="toast" id="toast" role="status"></div>
<div class="modal" id="modal" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="modalMsg">
    <p id="modalMsg"></p>
    <div class="dlg-actions"><button class="btn" id="modalNo">取消</button><button class="btn primary" id="modalYes">確定</button></div>
  </div>
</div>

<script>
const KEY = 'wedding-bingo-mockup-v1', MAX = 50, TABLES = 20, SEATS = 10, NEED = 3, FREE = 12, NUDGE_MS = 15000;
const LINES = (() => {
  const r = [0, 1, 2, 3, 4], L = [];
  r.forEach(a => { L.push(r.map(b => a * 5 + b)); L.push(r.map(b => b * 5 + a)); });
  L.push([0, 6, 12, 18, 24], [4, 8, 12, 16, 20]);
  return L;
})();
const app = document.getElementById('app');

// ---------- 模擬後端（localStorage 在同瀏覽器分頁間共享） ----------
let memState = null;

/** 建立空白遊戲狀態 */
function fresh() {
  return { salt: Math.random().toString(36).slice(2, 8), drawn: [], drawTimes: [], seats: {}, winners: [] };
}

/** 讀取共享狀態 */
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  if (!memState) { memState = fresh(); try { localStorage.setItem(KEY, JSON.stringify(memState)); } catch (e) {} }
  return memState;
}

/** 寫回共享狀態並重繪 */
function save(s) {
  memState = s;
  try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  render();
}

// 每個分頁視為一支手機，裝置 id 與綁定座位存在 sessionStorage
const tabStore = {
  mem: {},
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return this.mem[k] ?? null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { this.mem[k] = v; } },
  del(k) { try { sessionStorage.removeItem(k); } catch (e) { delete this.mem[k]; } }
};
const DEV = tabStore.get('dev') || (() => { const d = 'd' + Math.random().toString(36).slice(2, 10); tabStore.set('dev', d); return d; })();

// ---------- 賓果邏輯 ----------
const cardCache = new Map();

/** 以座位代碼加遊戲鹽值產生固定卡面，中心 0 為免費格 */
function cardOf(key, salt) {
  const id = salt + '|' + key;
  if (cardCache.has(id)) return cardCache.get(id);
  let h = 2166136261;
  for (const ch of id) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  let a = h >>> 0;
  const rnd = () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const nums = Array.from({ length: MAX }, (_, i) => i + 1);
  for (let i = nums.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [nums[i], nums[j]] = [nums[j], nums[i]]; }
  const card = nums.slice(0, 24);
  card.splice(FREE, 0, 0);
  cardCache.set(id, card);
  return card;
}

/** 回傳已完成的線（格子索引陣列） */
function doneLines(card, has) {
  return LINES.filter(l => l.every(i => i === FREE || has(card[i])));
}

/** 依開號順序算出第幾號達成指定線數，未達成回傳 0 */
function completeAt(card, drawn) {
  const at = new Map(drawn.map((n, i) => [n, i + 1]));
  const ends = LINES.map(l => Math.max(...l.map(i => i === FREE ? 0 : (at.get(card[i]) ?? Infinity)))).sort((x, y) => x - y);
  return Number.isFinite(ends[NEED - 1]) ? ends[NEED - 1] : 0;
}

/** 是否只差一個號碼就達成（聽牌） */
function isReach(card, set) {
  if (doneLines(card, n => set.has(n)).length >= NEED) return false;
  return card.some((n, i) => i !== FREE && !set.has(n) && doneLines(card, m => m === n || set.has(m)).length >= NEED);
}

/** 彙整所有座位的狀態：joined / reach / unclaimed / won */
function seatStats(s) {
  const set = new Set(s.drawn), won = new Set(s.winners.map(w => w.key));
  const r = { joined: 0, reach: 0, unclaimed: 0, won: won.size, byKey: {} };
  for (const key in s.seats) {
    const card = cardOf(key, s.salt);
    let st = 'joined';
    if (won.has(key)) st = 'won';
    else if (doneLines(card, n => set.has(n)).length >= NEED) { st = 'unclaimed'; r.unclaimed++; }
    else if (isReach(card, set)) { st = 'reach'; r.reach++; }
    r.joined++;
    r.byKey[key] = st;
  }
  return r;
}

/** 依完成號次分組得獎者 */
function groupWinners(s) {
  const g = new Map();
  [...s.winners].sort((a, b) => a.at - b.at || a.ts - b.ts).forEach(w => {
    if (!g.has(w.at)) g.set(w.at, []);
    g.get(w.at).push(w);
  });
  return [...g];
}

/** 座位代碼轉顯示文字 */
const label = k => { const [t, n] = k.split('-'); return `${t} 桌 ${n} 號`; };

/** 名單顯示，過長時截斷 */
const names = (ks, max = 24) => ks.length ? ks.slice(0, max).map(label).join('、') + (ks.length > max ? ` 等 ${ks.length} 人` : '') : '—';

// ---------- 操作 ----------
/** 開出號碼，模擬賓客自動標記並喊 BINGO */
function drawNumber(n) {
  const s = load();
  if (!Number.isInteger(n) || n < 1 || n > MAX || s.drawn.includes(n)) return false;
  s.drawn.push(n);
  s.drawTimes.push(Date.now());
  const won = new Set(s.winners.map(w => w.key));
  for (const key in s.seats) {
    if (!s.seats[key].bot || won.has(key)) continue;
    const at = completeAt(cardOf(key, s.salt), s.drawn);
    if (at) s.winners.push({ key, at, ts: Date.now() });
  }
  save(s);
  return true;
}

/** 從剩餘號碼中隨機開一號 */
function drawRandom() {
  const s = load(), left = [];
  for (let n = 1; n <= MAX; n++) if (!s.drawn.includes(n)) left.push(n);
  if (!left.length) { toast('號碼已全部開完'); return false; }
  return drawNumber(left[Math.floor(Math.random() * left.length)]);
}

/** 撤銷最後一號，連帶移除該號的標記與得獎 */
function undo() {
  const s = load();
  if (!s.drawn.length) return;
  const n = s.drawn.pop();
  s.drawTimes.pop();
  for (const k in s.seats) s.seats[k].marks = (s.seats[k].marks || []).filter(x => x !== n);
  s.winners = s.winners.filter(w => w.at <= s.drawn.length);
  save(s);
  toast(`已撤銷 ${n} 號`);
}

/** 加入模擬賓客到空位 */
function addBots(count) {
  const s = load(), free = [];
  for (let t = 1; t <= TABLES; t++) for (let i = 1; i <= SEATS; i++) if (!s.seats[`${t}-${i}`]) free.push(`${t}-${i}`);
  free.sort(() => Math.random() - .5);
  const picked = free.slice(0, count);
  picked.forEach(k => {
    s.seats[k] = { dev: 'bot', bot: true, marks: [] };
    const at = completeAt(cardOf(k, s.salt), s.drawn);
    if (at) s.winners.push({ key: k, at, ts: Date.now() });
  });
  save(s);
  toast(`已加入 ${picked.length} 位模擬賓客`);
}

/** 移除所有模擬賓客 */
function clearBots() {
  const s = load();
  for (const k in s.seats) if (s.seats[k].bot) delete s.seats[k];
  s.winners = s.winners.filter(w => s.seats[w.key]);
  save(s);
}

/** 頁內確認對話框（部分內嵌瀏覽器會擋 confirm） */
function ask(msg) {
  const m = document.getElementById('modal');
  document.getElementById('modalMsg').textContent = msg;
  m.hidden = false;
  document.getElementById('modalYes').focus();
  return new Promise(res => {
    const done = ok => { m.hidden = true; m.onclick = null; res(ok); };
    m.onclick = e => {
      if (e.target.id === 'modalYes') done(true);
      else if (e.target.id === 'modalNo' || e.target === m) done(false);
    };
  });
}

let autoTimer = null;

/** 切換自動開號 */
function setAuto(on) {
  clearInterval(autoTimer);
  autoTimer = on ? setInterval(() => { if (!drawRandom()) setAuto(false); }, 3000) : null;
  render();
}

let toastTimer, ovTimer;

/** 顯示短暫提示 */
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------- 畫面 ----------
let seenDrawn = -1, seenWinners = -1;

/** 號碼有更新時回傳動畫 class */
function popClass(s) {
  const changed = seenDrawn >= 0 && s.drawn.length > seenDrawn;
  if (changed && view() === 'guest') try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
  seenDrawn = s.drawn.length;
  return changed ? ' pop' : '';
}

/** 目前檢視的頁面 */
function view() {
  const v = location.hash.slice(1);
  return ['guest', 'admin', 'screen'].includes(v) ? v : 'guest';
}

/** 選座位頁 */
function pickerHTML(s) {
  const t = +(tabStore.get('table') || 1);
  const opts = Array.from({ length: TABLES }, (_, i) => `<option value="${i + 1}"${i + 1 === t ? ' selected' : ''}>第 ${i + 1} 桌</option>`).join('');
  const seats = Array.from({ length: SEATS }, (_, i) => {
    const k = `${t}-${i + 1}`, taken = s.seats[k] && s.seats[k].dev;
    return `<button class="seat" data-act="bind" data-k="${k}" ${taken ? 'disabled' : ''}><b>${i + 1}</b><small>${taken ? '已入座' : '選擇'}</small></button>`;
  }).join('');
  return `<section class="guest">
    <header class="g-head"><p class="eyebrow">Wedding Bingo</p><h1>一起來玩賓果吧</h1><p class="muted">請選擇你的座位號碼</p></header>
    <label class="qr-sim"><span>Mockup：模擬掃到的桌號 QR</span><select id="tableSel">${opts}</select></label>
    <div class="table-name">第 ${t} 桌</div>
    <div class="seats">${seats}</div>
    <p class="hint">選定後這支手機會綁定該座位，<br>換手機請找主持人協助。</p>
  </section>`;
}

/** 賓客賓果卡頁 */
function guestHTML(s) {
  const key = tabStore.get('seat'), seat = key && s.seats[key];
  if (!seat || seat.dev !== DEV) { if (key) tabStore.del('seat'); return pickerHTML(s); }
  const card = cardOf(key, s.salt), marks = new Set(seat.marks);
  const lines = doneLines(card, n => marks.has(n));
  const inLine = new Set(lines.flat());
  const win = s.winners.find(w => w.key === key);
  const last = s.drawn.at(-1), pop = popClass(s);
  const cells = card.map((n, i) => {
    if (i === FREE) return `<div class="cell free${inLine.has(i) ? ' in-line' : ''}" aria-label="免費格">♥</div>`;
    const on = marks.has(n), di = s.drawn.indexOf(n);
    const t = !on && di >= 0 ? s.drawTimes[di] : '';
    return `<button class="cell${on ? ' on' : ''}${inLine.has(i) ? ' in-line' : ''}" data-act="mark" data-n="${n}" data-t="${t}">${n}</button>`;
  }).join('');
  const dots = Array.from({ length: NEED }, (_, i) => `<i class="${i < lines.length ? 'on' : ''}"></i>`).join('');
  const action = win
    ? `<div class="won"><b>🎉 恭喜賓果！</b>已登記得獎（第 ${win.at} 號完成），請聽主持人指示</div>`
    : `<button class="bingo" data-act="bingo" ${lines.length >= NEED ? '' : 'disabled'}>BINGO!</button>`;
  return `<section class="guest">
    <header class="g-head"><p class="eyebrow">Wedding Bingo</p><h1>${label(key)}</h1></header>
    <div class="latest">
      <div class="ball${last ? '' : ' empty'}${pop}">${last ?? '–'}</div>
      <div><div class="t">最新號碼</div><div class="v">已開出 ${s.drawn.length} / ${MAX}</div></div>
      <div class="progress"><div class="t">連線 ${lines.length} / ${NEED}</div><div class="dots">${dots}</div></div>
    </div>
    <div class="card">${[...'BINGO'].map(c => `<div class="hd">${c}</div>`).join('')}${cells}</div>
    ${action}
    <p class="hint">只能點選已開出的號碼；開出 15 秒還沒點的號碼會閃爍提醒。<br>連滿 ${NEED} 條線後按下 BINGO，系統會自動驗證。</p>
    <details class="history"><summary>已開出號碼（${s.drawn.length}）</summary><div class="chips">${[...s.drawn].reverse().map(n => `<span>${n}</span>`).join('') || '<em class="muted">尚未開號</em>'}</div></details>
    <button class="linkbtn" data-act="leave">Mockup：釋放此座位</button>
  </section>`;
}

/** 後台頁 */
function adminHTML(s) {
  const st = seatStats(s), last = s.drawn.at(-1), set = new Set(s.drawn), pop = popClass(s);
  const board = Array.from({ length: MAX }, (_, i) => `<div class="${i + 1 === last ? 'last' : set.has(i + 1) ? 'on' : ''}">${i + 1}</div>`).join('');
  const groups = groupWinners(s);
  const winners = groups.length ? groups.map(([at, ws], gi) => `<li><span class="rank">${gi + 1}</span><div>
      <b>第 ${at} 號完成</b>${ws.length > 1 ? `<span class="pill warn">同時 ${ws.length} 人</span>` : ''}
      <div class="names">${ws.map(w => label(w.key) + (s.seats[w.key]?.bot ? '<small>（模擬）</small>' : '')).join('、')}</div></div></li>`).join('')
    : '<li class="empty">尚無得獎者</li>';
  const listOf = stt => Object.keys(st.byKey).filter(k => st.byKey[k] === stt);
  const seatmap = Array.from({ length: TABLES }, (_, ti) => {
    const cells = Array.from({ length: SEATS }, (_, si) => {
      const k = `${ti + 1}-${si + 1}`, seat = s.seats[k];
      const cls = !seat ? '' : !seat.dev ? 'unbound' : st.byKey[k];
      return `<button class="sq ${cls}" data-act="seat" data-k="${k}" title="${label(k)}${seat?.bot ? '（模擬）' : ''}">${si + 1}</button>`;
    }).join('');
    return `<div class="trow"><span>${ti + 1} 桌</span>${cells}</div>`;
  }).join('');
  return `<section class="admin">
    <header class="admin-head"><h1>賓果後台</h1><span class="muted">Mockup：正式版需管理員登入</span></header>

    <div class="panel s5">
      <h2>開號</h2>
      <div class="draw-top">
        <div class="ball${last ? '' : ' empty'}${pop}">${last ?? '–'}</div>
        <div><div class="big">已開出 ${s.drawn.length} / ${MAX}</div><div class="muted">規則：連滿 ${NEED} 條線</div></div>
      </div>
      <div class="draw-actions">
        <button class="btn primary" data-act="draw" ${s.drawn.length >= MAX ? 'disabled' : ''}>🎲 抽下一號</button>
        <form class="manual" id="manualForm"><input id="manualN" type="number" min="1" max="${MAX}" inputmode="numeric" placeholder="手動輸入號碼（實體搖號用）"><button class="btn">開出</button></form>
        <button class="btn" data-act="undo" ${s.drawn.length ? '' : 'disabled'}>↶ 撤銷上一號</button>
        <label class="check"><input type="checkbox" data-act="auto" ${autoTimer ? 'checked' : ''}> 自動開號（每 3 秒，展示用）</label>
      </div>
    </div>

    <div class="panel s7">
      <h2>即時狀態</h2>
      <div class="tiles">
        <div class="tile"><span>已入座</span><b>${st.joined}</b><small>/ ${TABLES * SEATS}</small></div>
        <div class="tile warn"><span>聽牌（差 1 號）</span><b>${st.reach}</b></div>
        <div class="tile accent"><span>已連線未按</span><b>${st.unclaimed}</b></div>
        <div class="tile gold"><span>得獎</span><b>${st.won}</b></div>
      </div>
      <dl class="namelist">
        <dt>已連線但還沒按 BINGO（主持人可提醒）</dt><dd>${names(listOf('unclaimed'))}</dd>
        <dt>聽牌中</dt><dd>${names(listOf('reach'))}</dd>
      </dl>
    </div>

    <div class="panel s5"><h2>得獎名單（依完成號次，同號視為並列）</h2><ul class="winners">${winners}</ul></div>
    <div class="panel s7"><h2>號碼盤</h2><div class="board">${board}</div></div>

    <div class="panel s8">
      <h2>座位總覽（點已入座的座位可解除綁定）</h2>
      <div class="legend">
        <span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>空位</span>
        <span><i style="background:var(--info-soft)"></i>已入座</span>
        <span><i style="background:var(--warn-soft);border:1px solid var(--warn)"></i>聽牌</span>
        <span><i style="background:var(--accent)"></i>已連線未按</span>
        <span><i style="background:var(--gold)"></i>得獎</span>
        <span><i style="border:1px dashed var(--muted)"></i>已解除綁定</span>
      </div>
      <div class="seatmap">${seatmap}</div>
    </div>

    <div class="panel s4">
      <h2>測試與遊戲控制</h2>
      <div class="tools">
        <form class="manual" id="botForm"><input id="botN" type="number" min="1" max="${TABLES * SEATS}" value="150"><button class="btn">加入模擬賓客</button></form>
        <button class="btn" data-act="clearBots">移除模擬賓客</button>
        <hr>
        <button class="btn" data-act="newRound">開新一局（保留座位，換新卡面）</button>
        <button class="btn danger" data-act="wipe">全部清空</button>
      </div>
    </div>
  </section>`;
}

/** 大螢幕頁 */
function screenHTML(s) {
  const st = seatStats(s), last = s.drawn.at(-1), set = new Set(s.drawn), pop = popClass(s);
  const recent = s.drawn.slice(-6, -1).reverse();
  const board = Array.from({ length: MAX }, (_, i) => `<div class="${i + 1 === last ? 'last' : set.has(i + 1) ? 'on' : ''}">${i + 1}</div>`).join('');
  const winners = groupWinners(s).flatMap(([, ws]) => ws).map(w => `<span class="sc-chip">${label(w.key)}</span>`).join('')
    || '<span class="sc-dim">等待第一位賓果得主…</span>';
  return `<section class="screen">
    <header class="sc-title"><h1>WEDDING BINGO</h1><span>連滿 ${NEED} 條線即可喊 BINGO</span></header>
    <div class="sc-left">
      <div class="sc-label">最新號碼</div>
      <div class="sc-ball${last ? '' : ' empty'}${pop}">${last ?? '–'}</div>
      <div class="sc-count">${s.drawn.length ? `第 ${s.drawn.length} 顆` : '即將開始'}</div>
      <div class="sc-recent">${recent.map(n => `<span>${n}</span>`).join('')}</div>
    </div>
    <div class="sc-board">${board}</div>
    <footer class="sc-foot">
      <div class="sc-stats"><div><small>參加</small><b>${st.joined}</b></div><div><small>聽牌</small><b>${st.reach}</b></div><div><small>得獎</small><b>${st.won}</b></div></div>
      <div class="sc-winners">${winners}</div>
    </footer>
  </section>`;
}

/** 大螢幕出現新得獎者時跳出公告 */
function announce(s) {
  if (seenWinners >= 0 && s.winners.length > seenWinners) {
    const ks = s.winners.slice(seenWinners).map(w => label(w.key));
    const ov = document.getElementById('overlay');
    ov.querySelector('p').textContent = ks.slice(0, 6).join('、') + (ks.length > 6 ? ` 等 ${ks.length} 人` : '');
    ov.classList.add('show');
    clearTimeout(ovTimer);
    ovTimer = setTimeout(() => ov.classList.remove('show'), 5000);
  }
  seenWinners = s.winners.length;
}

/** 更新未標記號碼的閃爍提醒 */
function updateNudge() {
  const now = Date.now();
  document.querySelectorAll('.cell[data-t]').forEach(c => {
    const t = +c.dataset.t;
    c.classList.toggle('nudge', t > 0 && now - t > NUDGE_MS);
  });
}

/** 依目前頁面重繪，保留正在輸入的欄位 */
function render() {
  const v = view(), s = load();
  document.body.dataset.view = v;
  document.querySelectorAll('.demo-bar a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + v));
  const f = document.activeElement, keep = f && f.id && f.tagName === 'INPUT' ? { id: f.id, v: f.value } : null;
  app.innerHTML = v === 'guest' ? guestHTML(s) : v === 'admin' ? adminHTML(s) : screenHTML(s);
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.value = keep.v; el.focus(); } }
  if (v === 'screen') announce(s);
  if (v === 'guest') updateNudge();
}

// ---------- 事件 ----------
const actions = {
  async bind(b) {
    const k = b.dataset.k;
    if (!await ask(`確認你是「${label(k)}」嗎？\n綁定後無法自行更換。`)) return;
    const s = load();
    if (s.seats[k] && s.seats[k].dev) { toast('這個座位剛被別人選走了'); return render(); }
    s.seats[k] = { ...(s.seats[k] || { marks: [] }), dev: DEV };
    tabStore.set('seat', k);
    save(s);
  },
  mark(b) {
    const n = +b.dataset.n, s = load(), key = tabStore.get('seat'), seat = s.seats[key];
    if (!seat || seat.dev !== DEV) return render();
    if (s.winners.some(w => w.key === key)) return toast('已登記得獎，卡面已鎖定');
    if (!s.drawn.includes(n)) {
      b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
      return toast(`${n} 號還沒開出喔`);
    }
    const m = new Set(seat.marks);
    m.has(n) ? m.delete(n) : m.add(n);
    seat.marks = [...m];
    save(s);
  },
  bingo() {
    const s = load(), key = tabStore.get('seat'), seat = s.seats[key];
    if (!seat || seat.dev !== DEV) return render();
    if (s.winners.some(w => w.key === key)) return render();
    const card = cardOf(key, s.salt), marks = new Set(seat.marks.filter(n => s.drawn.includes(n)));
    if (doneLines(card, n => marks.has(n)).length < NEED) return toast(`還沒連滿 ${NEED} 條線喔`);
    const at = completeAt(card, s.drawn);
    if (!at) return toast('驗證未通過，請找主持人確認');
    s.winners.push({ key, at, ts: Date.now() });
    save(s);
    toast('🎉 驗證通過，BINGO！');
  },
  leave() {
    const s = load(), key = tabStore.get('seat');
    if (s.seats[key]) s.seats[key].dev = null;
    tabStore.del('seat');
    save(s);
  },
  draw() { drawRandom(); },
  async undo() { if (await ask('確定撤銷上一個號碼？')) undo(); },
  auto(b) { setAuto(b.checked); },
  async seat(b) {
    const k = b.dataset.k, s = load(), seat = s.seats[k];
    if (!seat) return toast(`${label(k)} 尚未入座`);
    if (!seat.dev) return toast(`${label(k)} 已解除綁定，等待重新入座（卡面與標記保留）`);
    if (!await ask(`解除「${label(k)}」的手機綁定？\n賓客可用新手機重新選此座位，卡面與標記會保留。`)) return;
    seat.dev = null;
    save(s);
  },
  clearBots() { clearBots(); },
  async newRound() {
    if (!await ask('開新一局？開號與得獎會清空，所有人換新卡面，座位綁定保留。')) return;
    const s = load();
    Object.assign(s, { salt: fresh().salt, drawn: [], drawTimes: [], winners: [] });
    for (const k in s.seats) s.seats[k].marks = [];
    save(s);
  },
  async wipe() {
    if (!await ask('全部清空？包含所有座位綁定。')) return;
    setAuto(false);
    save(fresh());
  }
};

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && actions[b.dataset.act]) actions[b.dataset.act](b);
});
app.addEventListener('change', e => {
  if (e.target.id === 'tableSel') { tabStore.set('table', e.target.value); render(); }
});
app.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'manualForm') {
    const n = +document.getElementById('manualN').value;
    if (drawNumber(n)) document.getElementById('manualN').value = '';
    else toast('號碼無效或已開出');
  } else if (e.target.id === 'botForm') {
    addBots(Math.max(1, +document.getElementById('botN').value || 0));
  }
});
document.getElementById('overlay').addEventListener('click', e => e.currentTarget.classList.remove('show'));
window.addEventListener('storage', e => { if (e.key === KEY) render(); });
window.addEventListener('hashchange', () => { seenDrawn = seenWinners = -1; render(); });
setInterval(() => { if (view() === 'guest') updateNudge(); }, 1000);
render();
</script>
</body>
</html>
